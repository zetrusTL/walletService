services:
  db:
    image: postgres:16-alpine
    container_name: wallet_db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init/01-create-exchanger-db.sh:/docker-entrypoint-initdb.d/01-create-exchanger-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    image: postgres:16-alpine
    container_name: wallet_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wallet
      PGPASSWORD: wallet
      PGDATABASE: wallet
    volumes:
      - ./migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/run-migrations.sh"]

  exchanger_migrator:
    image: postgres:16-alpine
    container_name: exchanger_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wallet
      PGPASSWORD: wallet
      PGDATABASE: exchanger
    volumes:
      - ./gw-exchanger/migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/run-migrations.sh"]

  app:
    build:
      context: .
      dockerfile: gw-currency-wallet/Dockerfile
    container_name: wallet_app
    env_file:
      - gw-currency-wallet/config.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      EXCHANGER_ADDR: exchanger:9090
    entrypoint: ["sh", "-c"]
    command: ["echo '=== app wrapper ==='; /app/wallet 2>&1; e=$$?; echo 'Exit code:' $$e; exit $$e"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      exchanger:
        condition: service_started
    ports:
      - "8080:8080"

  exchanger:
    build:
      context: .
      dockerfile: gw-exchanger/Dockerfile
    container_name: exchanger_app
    env_file:
      - gw-exchanger/config.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      exchanger_migrator:
        condition: service_completed_successfully
    ports:
      - "9090:9090"

  # Kafka KRaft (без Zookeeper). Официальный образ Apache Kafka
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9092"

  mongo:
    image: mongo:6
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  notification:
    build:
      context: .
      dockerfile: gw-notification/Dockerfile
    container_name: notification_app
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: large_transactions
      MONGO_URI: mongodb://mongo:mongo@mongo:27017
      MONGO_DB: notification
    depends_on:
      - kafka
      - mongo

volumes:
  dbdata:
  mongo_data:
