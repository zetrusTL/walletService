services:
  db:
    image: postgres:16-alpine
    container_name: wallet_db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init/01-create-exchanger-db.sh:/docker-entrypoint-initdb.d/01-create-exchanger-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    image: postgres:16-alpine
    container_name: wallet_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wallet
      PGPASSWORD: wallet
      PGDATABASE: wallet
    volumes:
      - ./migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/run-migrations.sh"]

  exchanger_migrator:
    image: postgres:16-alpine
    container_name: exchanger_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: wallet
      PGPASSWORD: wallet
      PGDATABASE: exchanger
    volumes:
      - ./gw-exchanger/migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/run-migrations.sh"]

  app:
    build:
      context: .
      dockerfile: gw-currency-wallet/Dockerfile
    container_name: wallet_app
    env_file:
      - gw-currency-wallet/config.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      EXCHANGER_ADDR: exchanger:9090
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_LARGE_TRANSACTIONS: large_transactions
      LARGE_TRANSACTION_THRESHOLD: "40000"
    entrypoint: ["sh", "-c"]
    command: ["echo '=== app wrapper ==='; /app/wallet 2>&1; e=$$?; echo 'Exit code:' $$e; exit $$e"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      exchanger:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  exchanger:
    build:
      context: .
      dockerfile: gw-exchanger/Dockerfile
    container_name: exchanger_app
    env_file:
      - gw-exchanger/config.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      exchanger_migrator:
        condition: service_completed_successfully
    ports:
      - "9090:9090"

  # Zookeeper для Confluent Kafka (управление consumer groups и offsets)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Confluent Kafka с Zookeeper (поддержка consumer groups)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:6
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  notification:
    build:
      context: .
      dockerfile: gw-notification/Dockerfile
    container_name: notification_app
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: large_transactions
      KAFKA_GROUP_ID: notification-service
      MONGO_URI: mongodb://mongo:mongo@mongo:27017/?authSource=admin
      MONGO_DB: notification
      MONGO_COLLECTION: large_transactions
      HEALTH_PORT: "8081"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  pv_producer:
    build:
      context: .
      dockerfile: pv-producer/Dockerfile
    container_name: pv_producer
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: page_views
      KAFKA_DLQ_TOPIC: page_views_dlq
      HTTP_PORT: "8082"
      DEFAULT_MODE: regular
      DEFAULT_RPS: "5"
      BATCH_SIZE: "200"
      FLUSH_MS: "1000"
      SEND_MODE: batch
      PARTITION_STRATEGY: key
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  pv_aggregator:
    build:
      context: .
      dockerfile: pv-aggregator/Dockerfile
    container_name: pv_aggregator
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: page_views
      KAFKA_DLQ_TOPIC: page_views_dlq
      KAFKA_GROUP_ID: pv-aggregator
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL_MS: "2000"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      DLQ_ENABLED: "true"
      HEALTH_PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse_init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse_init:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse_init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./init/clickhouse-init.sql:/init.sql:ro
    entrypoint: ["/bin/sh"]
    command: ["-c", "sleep 3 && clickhouse-client --host clickhouse --port 9000 --multiquery < /init.sql || echo 'Init completed (some statements may already exist)'"]

  kdiag:
    build:
      context: .
      dockerfile: pv-tools/kdiag/Dockerfile
    container_name: kdiag
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: page_views
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - tools

volumes:
  dbdata:
  mongo_data:
  clickhouse_data:
